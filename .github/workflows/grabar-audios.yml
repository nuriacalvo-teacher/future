# Graba la narracion del video-leccion (video/index.html) y la sube al
# repositorio.
#
# No hace falta instalar nada ni abrir el terminal: se lanza desde la pestaña
# "Actions" de GitHub, con el boton "Run workflow".
#
# Tarda unos cinco minutos (son 64 clips). Se puede cerrar la pagina mientras
# tanto: sigue corriendo en los servidores de GitHub.

name: Grabar la narracion del video

on:
  workflow_dispatch:
    inputs:
      muestra:
        description: 'Solo una muestra corta con las voces elegidas'
        type: boolean
        required: false
        default: false
      comparativa:
        description: 'Solo una comparativa con TODAS las voces britanicas, para elegir'
        type: boolean
        required: false
        default: false
      only:
        description: 'Solo estos clips (opcional), separados por espacios. Ej: s1_2 q0'
        required: false
        default: ''
      force:
        description: 'Regrabar aunque el clip ya exista'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: grabar-audios
  cancel-in-progress: false

jobs:
  grabar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar edge-tts
        run: python -m pip install --upgrade pip edge-tts

      - name: Grabar una muestra de las voces
        if: ${{ inputs.muestra && !inputs.comparativa }}
        run: python3 tools/build_video.py --demo

      - name: Grabar la comparativa de todas las voces
        if: ${{ inputs.comparativa }}
        run: python3 tools/build_video.py --audition

      - name: Dejar el audio listo para descargar
        if: ${{ inputs.muestra || inputs.comparativa }}
        uses: actions/upload-artifact@v4
        with:
          name: voces-para-escuchar
          path: |
            video/audio/muestra-voces.mp3
            video/audio/comparativa-voces.mp3
          if-no-files-found: error
          retention-days: 7

      - name: Grabar la narracion
        if: ${{ !inputs.muestra && !inputs.comparativa }}
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${ONLY}" ]; then
            # shellcheck disable=SC2206
            ARGS+=(--only ${ONLY})
          fi
          if [ "${FORCE}" = "true" ]; then
            ARGS+=(--force)
          fi
          python3 tools/build_video.py "${ARGS[@]}"

      - name: Subir la narracion al repositorio
        if: ${{ !inputs.muestra && !inputs.comparativa }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add video/audio
          if git diff --staged --quiet; then
            echo 'No hay narracion nueva que subir.'
            exit 0
          fi
          git commit -m 'Narracion del video grabada automaticamente'
          git push

      - name: Resumen
        if: ${{ always() && !inputs.muestra && !inputs.comparativa }}
        run: |
          if [ -f video/audio/manifest.json ]; then
            python3 -c "import json; d=json.load(open('video/audio/manifest.json')); c=d['clips']; t=sum(x['d'] for x in c.values()); print('## Narracion del video\\n\\n- %d clips · %d min %02d s\\n- voces: %s' % (len(c), t//60, t%60, ', '.join('%s = %s' % kv for kv in sorted(d['voices'].items()))))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Narracion del video' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'No se grabo nada. Revisa el registro del paso anterior.' >> "$GITHUB_STEP_SUMMARY"
          fi
