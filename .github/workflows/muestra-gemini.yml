# Muestra de narracion con las voces de Gemini (las de NotebookLM).
# Graba el capitulo 1 en dos versiones (una narradora / profesora + alumno)
# con varias parejas de voces, y deja los MP3 para descargar.
#
# Se lanza desde la pestaña "Actions" con "Run workflow". Necesita el secreto
# GEMINI_API_KEY. Gasta 8 de las 10 peticiones diarias del plan gratuito.

name: Muestra de voces Gemini

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  muestra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Grabar la muestra
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/gemini/muestra.py

      - name: Dejar el audio listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: muestra-voces-gemini
          path: tools/gemini/salida/
          if-no-files-found: error
          retention-days: 14
